# 01_Dataset/data.yaml

# 1. 请把下面的路径改成你电脑上的实际路径
path: D:/Document/000_school/2025_4up/yolo_electric/01_Dataset  # 数据集根目录
train: images/train              # 训练集图片 (相对于path)
val: images/val                  # 验证集图片 (相对于path)

# 2. 类别数量
nc: 5

# 3. 类别名称 (必须与 labelImg 的 classes.txt 顺序一致)
# 对应: 绝缘子缺失, 绝缘子烧蚀, 鸟巢, 均压环移位
names:
  0: insulator_broken      # 破损
  1: insulator_burn        # 烧蚀/闪络
  2: nest             # 鸟巢 (你的数据)
  3: ring_shifted     # 均压环移位 (你的数据)
  4: insulator             # 绝缘子整体 (网上数据引入)